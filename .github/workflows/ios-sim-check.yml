name: "iOS: simulator screenshot"
# 아이폰에서만 생기는 화면 문제를 리눅스에서 볼 수 없어 만든 점검(2026-11-25 아이폰 책장 깨짐).
# 시험 서재(QA_SEED_LIB)로 시뮬레이터에서 앱을 켜고, 시간별 사진과 앱 로그를 Actions 결과물(ios-sim)로 남긴다.
# 시뮬레이터도 Impeller Metal로 그린다(셰이더 제한은 기기와 같다). 속도는 기기와 다르다.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-sim-check
  cancel-in-progress: true
jobs:
  sim:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build for simulator
        run: flutter build ios --simulator --debug --dart-define=QA_SEED_LIB=true --dart-define=QA_FRAMES=true
      - name: Boot simulator
        run: |
          OUT=$RUNNER_TEMP/ios-sim
          mkdir -p "$OUT"
          xcrun simctl list devices available > "$OUT/devices.txt"
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          print(next(x['udid'] for k, v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Run app and take screenshots
        run: |
          OUT=$RUNNER_TEMP/ios-sim
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch --console "$UDID" app.covebook > "$OUT/console.log" 2>&1 &
          t=0
          for at in 10 25 45 75 120; do
            sleep $((at - t)); t=$at
            xcrun simctl io "$UDID" screenshot "$OUT/shot-${at}s.png" || true
          done
          xcrun simctl spawn "$UDID" log show --last 5m --style compact --predicate 'process == "Runner"' > "$OUT/system.log" 2>&1 || true
          grep -n -i -E "impeller|metal|shader|buffer|error|flbake|fltotal|flwarm" "$OUT/console.log" "$OUT/system.log" | head -300 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-sim
          path: ${{ runner.temp }}/ios-sim
