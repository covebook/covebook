name: kodeploy-server

# server/가 바뀌어 main에 push되면, 테스트를 통과한 그 커밋을 KoDeploy(covebook 앱)에 배포한다.
# 인증은 GitHub OIDC라 저장소에 비밀이 없다. 앱 id는 저장소 변수 KODEPLOY_APP_ID.
# 이 파일만 고친 push로는 배포하지 않는다. 지금 main을 바로 배포하려면 Actions에서 Run workflow.
# PR(server/ 변경)에서는 시험만 돌고 배포하지 않는다.
# 시험은 PostgreSQL을 띄워 DB가 필요한 시험(결제·동기화·로그인)까지 돌린다. DB가 없으면 그 시험들은 건너뛰어 배포 전 관문이 비었었다(#49).
on:
  push:
    branches: [main]
    paths: ['server/**']
  pull_request:
    paths: ['server/**', '.github/workflows/kodeploy-server.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        # 로컬 시험과 같은 14. 버려도 되는 DB라 비밀번호 없이(trust) 띄운다
        image: postgres:14
        env:
          POSTGRES_USER: test
          POSTGRES_DB: test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test@localhost:5432/test?sslmode=disable
      TEST_EMPTY_DATABASE_URL: postgres://test@localhost:5432/empty?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      # Flyway V7→V8 시험용 빈 DB(TEST_EMPTY_DATABASE_URL)
      - run: psql "postgres://test@localhost:5432/test" -qc "CREATE DATABASE empty"
      # 캐시된 결과를 쓰지 않는다(DB 시험은 바깥 상태에 기대므로 매번 새로)
      - run: go test -count=1 ./...

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: kodeploy/deploy-action@678ee39b122c1242a5b12a22c1431a187205fd49 # v1.0.0
        with:
          app: ${{ vars.KODEPLOY_APP_ID }}
