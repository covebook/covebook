name: kodeploy-server

# server/가 바뀌어 main에 push되면, 테스트를 통과한 그 커밋을 KoDeploy(covebook 앱)에 배포한다.
# 인증은 GitHub OIDC라 저장소에 비밀이 없다. 앱 id는 저장소 변수 KODEPLOY_APP_ID.
# 이 파일만 고친 push로는 배포하지 않는다. 지금 main을 바로 배포하려면 Actions에서 Run workflow.
on:
  push:
    branches: [main]
    paths: ['server/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      # DB가 필요한 테스트는 TEST_DATABASE_URL이 없으면 건너뛴다
      - run: go test ./...

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: kodeploy/deploy-action@678ee39b122c1242a5b12a22c1431a187205fd49 # v1.0.0
        with:
          app: ${{ vars.KODEPLOY_APP_ID }}
