name: "CD: Android Flutter AAB"

# Flutter 앱(app/)을 Play 'app.covebook'에 올린다. 옛 앱(RN)과 같은 앱 id·같은 업로드 키라 그 위에 업데이트로 깔린다.
# 2026-11-18 사용자: CI/CD 자동으로 — main에 app/** 변경이 푸시되면 비공개 테스트(alpha)에 자동으로 올린다(예전 RN 워크플로처럼).
# versionName은 app/pubspec.yaml의 version(+ 앞), versionCode는 분 단위 시각. 손으로 돌리면 트랙·이름을 고를 수 있다
# 예전 RN 앱과 그 워크플로(android-playstore-deploy.yml)는 2026-11-18에 지웠고, Flutter가 그 자리(app/)로 옮겨 왔다.
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android-flutter-play.yml']
  workflow_dispatch:
    inputs:
      track:
        description: "Play Console release track"
        required: true
        default: "alpha"
        type: choice
        options:
          - alpha
          - internal
          - beta
      version_name:
        description: "versionName (비우면 app/pubspec.yaml의 version)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "AAB 만 만들고 Play 업로드는 건너뛴다"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# RN 워크플로와 같은 묶음: versionCode(분 단위 시각)가 겹치지 않게 한 번에 하나만
concurrency:
  group: android-playstore-release
  cancel-in-progress: false

jobs:
  deploy-flutter-android:
    if: github.ref == 'refs/heads/main'
    name: Build Flutter AAB and upload to Play
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        if: inputs.dry_run != true
        with:
          python-version: '3.12'
      - name: Check Play permission before building
        if: inputs.dry_run != true
        working-directory: .
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          REQUESTED_PLAY_TRACK: ${{ inputs.track || 'alpha' }}
        run: |
          python -m pip install --disable-pip-version-check --quiet 'google-auth>=2,<3' 'requests>=2,<3'
          python .github/scripts/check_play_access.py

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      # 기준 그림·날짜 시험은 서울 시간으로 만들었다
      - run: flutter test
        env:
          TZ: Asia/Seoul

      - name: Resolve release metadata
        env:
          VERSION_CODE_OFFSET: ${{ vars.ANDROID_VERSION_CODE_OFFSET || 0 }}
        run: |
          # RN 워크플로와 같은 규칙: 2025-01-01부터의 분 단위 시각(단조 증가, 겹치지 않음)
          minutes=$(( ($(date -u +%s) - 1735689600) / 60 ))
          echo "ANDROID_VERSION_CODE=$(( minutes + VERSION_CODE_OFFSET ))" >> "$GITHUB_ENV"
          name="${{ inputs.version_name }}"
          # 비었으면(푸시로 돈 때) pubspec의 version에서 + 앞
          [ -n "$name" ] || name=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          echo "ANDROID_VERSION_NAME=$name" >> "$GITHUB_ENV"

      - name: Restore Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          keystore_path="$RUNNER_TEMP/release-keystore.jks"
          echo "STORE_FILE=$keystore_path" >> "$GITHUB_ENV"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore_path"
          keytool -list -keystore "$keystore_path" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}" > /dev/null
          echo "✅ 키스토어 복원 확인"

      - name: Build release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --build-number="$ANDROID_VERSION_CODE" \
            --build-name="$ANDROID_VERSION_NAME" \
            --dart-define=SYNC_URL=https://covebook.kodeploy.com

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaekjang-flutter-${{ env.ANDROID_VERSION_CODE }}-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB to Play Console
        if: inputs.dry_run != true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.covebook
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'alpha' }}
          status: completed

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release-keystore.jks"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Android release (Flutter)"
            echo ""
            echo "- package: \`app.covebook\`"
            echo "- versionName: \`${ANDROID_VERSION_NAME}\`"
            echo "- versionCode: \`${ANDROID_VERSION_CODE}\`"
            echo "- track: \`${{ inputs.track || 'alpha' }}\`"
            echo "- Play 업로드: \`$([ "${{ inputs.dry_run }}" = "true" ] && echo 건너뜀 || echo 실행)\`"
          } >> "$GITHUB_STEP_SUMMARY"
