name: "CI: App check"

# 앱(app/**)을 바꾸는 PR에서 분석과 시험만 돌린다. 배포 워크플로(iOS TestFlight, 안드로이드 Play)는 main push에서만 돌아서,
# 그 전에는 앱 코드가 컴파일되는지조차 확인할 길이 없었다. 비밀 값을 쓰지 않는다.
# 결제를 켠 빌드(IAP=true)도 따로 분석·시험한다. 켜진 분기를 CI가 한 번도 보지 못하는 일을 막는다.

on:
  pull_request:
    paths: ['app/**', '.github/workflows/app-check.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      # 기준 그림·날짜 시험은 서울 시간으로 만들었다
      - run: flutter test
        env:
          TZ: Asia/Seoul
      - name: 결제를 켠 빌드로 시험
        run: flutter test --dart-define=IAP=true
        env:
          TZ: Asia/Seoul
      - name: Payment kit package
        working-directory: app/packages/iap_kit
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
